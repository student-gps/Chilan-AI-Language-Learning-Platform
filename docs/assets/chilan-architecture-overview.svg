<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="32" fill="#0F172A"/>
  <rect x="48" y="48" width="1504" height="804" rx="28" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <text x="96" y="132" fill="#F8FAFC" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">Chilan architecture at a glance</text>
  <text x="96" y="176" fill="#94A3B8" font-size="24" font-family="Arial, Helvetica, sans-serif">Frontend, backend, storage, and AI-assisted evaluation flow used throughout the platform.</text>

  <g>
    <rect x="96" y="264" width="286" height="142" rx="24" fill="#1E3A8A"/>
    <text x="126" y="330" fill="#DBEAFE" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Frontend</text>
    <text x="126" y="374" fill="#FFFFFF" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">React + Vite</text>
    <text x="126" y="410" fill="#DBEAFE" font-size="22" font-family="Arial, Helvetica, sans-serif">Home, Auth, Classroom, Course, Study</text>
  </g>

  <g>
    <rect x="96" y="490" width="286" height="142" rx="24" fill="#14532D"/>
    <text x="126" y="556" fill="#DCFCE7" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Workflow</text>
    <text x="126" y="600" fill="#FFFFFF" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">Teaching → Practice</text>
    <text x="126" y="636" fill="#DCFCE7" font-size="22" font-family="Arial, Helvetica, sans-serif">Text, speech, feedback, review loop</text>
  </g>

  <g>
    <rect x="498" y="208" width="344" height="192" rx="28" fill="#1F2937" stroke="#475569" stroke-width="2"/>
    <text x="530" y="276" fill="#CBD5E1" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Core service</text>
    <text x="530" y="326" fill="#FFFFFF" font-size="40" font-family="Arial, Helvetica, sans-serif" font-weight="700">FastAPI backend</text>
    <text x="530" y="368" fill="#E2E8F0" font-size="22" font-family="Arial, Helvetica, sans-serif">Auth, evaluation, review scheduling, media delivery</text>
  </g>

  <g>
    <rect x="498" y="468" width="344" height="228" rx="28" fill="#1F2937" stroke="#475569" stroke-width="2"/>
    <text x="530" y="536" fill="#CBD5E1" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Three-tier grading</text>
    <text x="530" y="584" fill="#FFFFFF" font-size="32" font-family="Arial, Helvetica, sans-serif" font-weight="700">Regex → Embeddings → LLM</text>
    <text x="530" y="624" fill="#E2E8F0" font-size="22" font-family="Arial, Helvetica, sans-serif">Fast acceptance for obvious answers, semantic matching for near-equivalents, detailed AI judgment when needed</text>
    <text x="530" y="668" fill="#E2E8F0" font-size="22" font-family="Arial, Helvetica, sans-serif">Integrated with FSRS-style review scoring and learner progress updates</text>
  </g>

  <g>
    <rect x="960" y="140" width="242" height="120" rx="22" fill="#312E81"/>
    <text x="990" y="200" fill="#E0E7FF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">AI services</text>
    <text x="990" y="234" fill="#FFFFFF" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">LLM + embeddings</text>
  </g>

  <g>
    <rect x="960" y="312" width="242" height="120" rx="22" fill="#7C2D12"/>
    <text x="990" y="372" fill="#FFEDD5" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Speech</text>
    <text x="990" y="406" fill="#FFFFFF" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">ASR + TTS</text>
  </g>

  <g>
    <rect x="960" y="484" width="242" height="120" rx="22" fill="#4C1D95"/>
    <text x="990" y="544" fill="#F3E8FF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Data</text>
    <text x="990" y="578" fill="#FFFFFF" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">PostgreSQL + pgvector</text>
  </g>

  <g>
    <rect x="960" y="656" width="242" height="120" rx="22" fill="#0F766E"/>
    <text x="990" y="716" fill="#CCFBF1" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Assets</text>
    <text x="990" y="750" fill="#FFFFFF" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">Cloudflare R2</text>
  </g>

  <g>
    <rect x="1290" y="312" width="182" height="120" rx="22" fill="#9A3412"/>
    <text x="1320" y="372" fill="#FFEDD5" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Publishing</text>
    <text x="1320" y="406" fill="#FFFFFF" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Content pipeline</text>
  </g>

  <g stroke="#64748B" stroke-width="4" stroke-linecap="round">
    <path d="M382 335H458"/>
    <path d="M382 562H458"/>
    <path d="M842 304H920"/>
    <path d="M842 572H920"/>
    <path d="M1202 372H1260"/>
  </g>

  <g fill="#64748B">
    <path d="M448 323L470 335L448 347V323Z"/>
    <path d="M448 550L470 562L448 574V550Z"/>
    <path d="M910 292L932 304L910 316V292Z"/>
    <path d="M910 560L932 572L910 584V560Z"/>
    <path d="M1250 360L1272 372L1250 384V360Z"/>
  </g>

  <text x="1268" y="546" fill="#94A3B8" font-size="22" font-family="Arial, Helvetica, sans-serif">Media-backed lessons, local creator tooling, and structured course delivery are all wired into the same product loop.</text>
</svg>