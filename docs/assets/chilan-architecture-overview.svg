<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 220) rotate(35) scale(440 320)">
      <stop stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1250 220) rotate(150) scale(420 320)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .font {
        font-family: "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, Helvetica, sans-serif;
      }
      .title { fill: #F8FAFC; font-size: 50px; font-weight: 700; }
      .title-cn { fill: #CBD5E1; font-size: 24px; font-weight: 600; }
      .subtitle { fill: #94A3B8; font-size: 22px; font-weight: 500; }
      .card-label { font-size: 18px; font-weight: 700; }
      .card-main { fill: #FFFFFF; font-size: 34px; font-weight: 700; }
      .card-main-lg { fill: #FFFFFF; font-size: 40px; font-weight: 700; }
      .card-main-sm { fill: #FFFFFF; font-size: 30px; font-weight: 700; }
      .card-cn { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; font-weight: 500; }
      .body-sm { font-size: 16px; font-weight: 500; }
      .note-title { fill: #FFFFFF; font-size: 24px; font-weight: 700; }
      .note-cn { fill: #E2E8F0; font-size: 18px; font-weight: 600; }
      .connector { stroke: #64748B; stroke-width: 4; stroke-linecap: round; }
      .arrow { fill: #64748B; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg-gradient)"/>
  <rect width="1600" height="900" rx="32" fill="url(#glow-left)"/>
  <rect width="1600" height="900" rx="32" fill="url(#glow-right)"/>
  <rect x="48" y="48" width="1504" height="804" rx="28" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <text x="96" y="132" class="font title">Chilan architecture at a glance</text>
  <text x="96" y="170" class="font title-cn">Chilan 架构总览</text>
  <text x="96" y="210" class="font subtitle">Frontend, backend, storage, and AI-assisted grading flow across the platform.</text>
  <text x="96" y="242" class="font subtitle">涵盖前端、后端、存储，以及 AI 参与的判题与学习闭环。</text>

  <g>
    <rect x="96" y="290" width="300" height="210" rx="24" fill="#1E3A8A"/>
    <text x="126" y="336" fill="#DBEAFE" class="font card-label">Frontend · 前端</text>
    <text x="126" y="378" class="font card-main">React + Vite</text>
    <text x="126" y="414" fill="#DBEAFE" class="font body">Home · Auth · Classroom</text>
    <text x="126" y="440" fill="#DBEAFE" class="font body">Course · Study</text>
    <text x="126" y="468" fill="#DBEAFE" class="font body">首页 · 认证 · 教室</text>
    <text x="126" y="492" fill="#DBEAFE" class="font body">课程 · 学习流程</text>
  </g>

  <g>
    <rect x="96" y="530" width="300" height="210" rx="24" fill="#14532D"/>
    <text x="126" y="576" fill="#DCFCE7" class="font card-label">Workflow · 学习流程</text>
    <text x="126" y="618" class="font card-main">Teach → practice</text>
    <text x="126" y="652" fill="#DCFCE7" class="font card-cn">教学 → 练习</text>
    <text x="126" y="680" fill="#DCFCE7" class="font body">Text · Speech · Feedback</text>
    <text x="126" y="708" fill="#DCFCE7" class="font body">Review loop · 复习循环</text>
  </g>

  <g>
    <rect x="448" y="220" width="430" height="250" rx="28" fill="#1F2937" stroke="#475569" stroke-width="2"/>
    <text x="480" y="270" fill="#CBD5E1" class="font card-label">Core service · 核心服务</text>
    <text x="480" y="316" class="font card-main-lg">FastAPI backend</text>
    <text x="480" y="350" fill="#CBD5E1" class="font card-cn">后端 API 与业务服务</text>
    <text x="480" y="388" fill="#E2E8F0" class="font body">Auth · Evaluation · Review</text>
    <text x="480" y="414" fill="#E2E8F0" class="font body">认证 · 判题 · 复习调度</text>
    <text x="480" y="442" fill="#E2E8F0" class="font body">Media delivery · App logic</text>
    <text x="480" y="466" fill="#E2E8F0" class="font body">媒体分发 · 应用逻辑</text>
  </g>

  <g>
    <rect x="448" y="500" width="430" height="250" rx="28" fill="#1F2937" stroke="#475569" stroke-width="2"/>
    <text x="480" y="548" fill="#CBD5E1" class="font card-label">Three-tier grading · 三层判题</text>
    <text x="480" y="592" class="font card-main-sm">Regex → Vector → LLM</text>
    <text x="480" y="626" fill="#CBD5E1" class="font card-cn">正则 → 向量语义 → 大模型</text>
    <text x="480" y="662" fill="#E2E8F0" class="font body">Fast pass · Semantic match</text>
    <text x="480" y="688" fill="#E2E8F0" class="font body">快速通过 · 语义匹配</text>
    <text x="480" y="716" fill="#E2E8F0" class="font body">AI feedback · FSRS updates</text>
    <text x="480" y="740" fill="#E2E8F0" class="font body">AI反馈 · FSRS进度更新</text>
  </g>

  <g>
    <rect x="938" y="150" width="270" height="126" rx="22" fill="#312E81"/>
    <text x="968" y="194" fill="#E0E7FF" class="font card-label">AI services · AI服务</text>
    <text x="968" y="228" class="font card-main-sm">LLM + vectors</text>
    <text x="968" y="254" fill="#E0E7FF" class="font body-sm">大模型判断 · 向量嵌入</text>
  </g>

  <g>
    <rect x="938" y="316" width="270" height="126" rx="22" fill="#7C2D12"/>
    <text x="968" y="360" fill="#FFEDD5" class="font card-label">Speech · 语音能力</text>
    <text x="968" y="394" class="font card-main-sm">ASR + TTS</text>
    <text x="968" y="420" fill="#FFEDD5" class="font body-sm">语音识别 · 语音合成</text>
  </g>

  <g>
    <rect x="938" y="482" width="270" height="126" rx="22" fill="#4C1D95"/>
    <text x="968" y="526" fill="#F3E8FF" class="font card-label">Data · 数据层</text>
    <text x="968" y="560" class="font card-main-sm">Postgres + vec</text>
    <text x="968" y="586" fill="#F3E8FF" class="font body-sm">数据库 · 向量检索</text>
  </g>

  <g>
    <rect x="938" y="648" width="270" height="126" rx="22" fill="#0F766E"/>
    <text x="968" y="692" fill="#CCFBF1" class="font card-label">Assets · 资源存储</text>
    <text x="968" y="726" class="font card-main-sm">Cloudflare R2</text>
    <text x="968" y="752" fill="#CCFBF1" class="font body-sm">媒体对象存储</text>
  </g>

  <g>
    <rect x="1262" y="316" width="242" height="126" rx="22" fill="#9A3412"/>
    <text x="1292" y="360" fill="#FFEDD5" class="font card-label">Publishing · 发布</text>
    <text x="1292" y="394" class="font card-main-sm">Build flow</text>
    <text x="1292" y="420" fill="#FFEDD5" class="font body-sm">内容构建流水线</text>
  </g>

  <g>
    <rect x="1262" y="500" width="242" height="274" rx="24" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text x="1292" y="544" fill="#CBD5E1" class="font card-label">Shared loop · 同一闭环</text>
    <text x="1292" y="578" class="font note-title">Learner + creator</text>
    <text x="1292" y="606" class="font note-cn">学习端 + 制课端</text>
    <text x="1292" y="650" fill="#E2E8F0" class="font body">Media lessons</text>
    <text x="1292" y="676" fill="#E2E8F0" class="font body">课程资源</text>
    <text x="1292" y="708" fill="#E2E8F0" class="font body">Build + publish</text>
    <text x="1292" y="734" fill="#E2E8F0" class="font body">生成与发布</text>
  </g>

  <g class="connector">
    <path d="M396 390H438"/>
    <path d="M396 636H438"/>
    <path d="M878 346H926"/>
    <path d="M878 620H926"/>
    <path d="M1208 379H1242"/>
  </g>

  <g class="arrow">
    <path d="M428 378L450 390L428 402V378Z"/>
    <path d="M428 624L450 636L428 648V624Z"/>
    <path d="M916 334L938 346L916 358V334Z"/>
