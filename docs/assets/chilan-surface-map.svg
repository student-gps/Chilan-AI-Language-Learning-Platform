    <text x="1158" y="688" class="font card-title-sm">Dev Console</text>
    <text x="1158" y="716" class="font card-cn">创作与维护工作台</text>
    <text x="1158" y="754" class="font body">Pipeline, sync, maintenance, preview</text>
