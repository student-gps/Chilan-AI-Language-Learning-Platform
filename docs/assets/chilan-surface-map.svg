<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font {
        font-family: "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, Helvetica, sans-serif;
      }
      .title { fill: #0F172A; font-size: 44px; font-weight: 700; }
      .title-cn { fill: #334155; font-size: 22px; font-weight: 600; }
      .subtitle { fill: #475569; font-size: 21px; font-weight: 500; }
      .chip { font-size: 18px; font-weight: 700; }
      .card-title { fill: #0F172A; font-size: 31px; font-weight: 700; }
      .card-title-sm { fill: #0F172A; font-size: 29px; font-weight: 700; }
      .card-cn { fill: #475569; font-size: 19px; font-weight: 600; }
      .body { fill: #334155; font-size: 17px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="96" y="96" width="64" height="64" rx="18" fill="#1D4ED8"/>
  <text x="128" y="139" text-anchor="middle" fill="white" font-size="38" class="font" font-weight="700">C</text>
  <text x="190" y="138" class="font title">Chilan product surfaces</text>
  <text x="190" y="172" class="font title-cn">Chilan 主要产品界面</text>
  <text x="190" y="208" class="font subtitle">README-friendly map of the main learner and creator flows in the project.</text>
  <text x="190" y="238" class="font subtitle">面向 README 展示的学习端与制课端界面概览。</text>

  <g>
