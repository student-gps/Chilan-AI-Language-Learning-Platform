<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 220) rotate(35) scale(440 320)">
      <stop stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1250 220) rotate(150) scale(420 320)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .font {
        font-family: "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, Helvetica, sans-serif;
      }
      .title { fill: #F8FAFC; font-size: 46px; font-weight: 700; }
      .subtitle { fill: #94A3B8; font-size: 19px; font-weight: 500; }
      .card-label { font-size: 15px; font-weight: 700; }
      .card-main-lg { fill: #FFFFFF; font-size: 32px; font-weight: 700; }
      .card-main { fill: #FFFFFF; font-size: 28px; font-weight: 700; }
      .card-main-sm { fill: #FFFFFF; font-size: 24px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; }
      .body-sm { font-size: 14px; font-weight: 500; }
      .note-title { fill: #FFFFFF; font-size: 24px; font-weight: 700; }
      .note-sub { fill: #CBD5E1; font-size: 16px; font-weight: 600; }
      .connector { stroke: #64748B; stroke-width: 3; stroke-linecap: round; }
      .arrow { fill: #64748B; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg-gradient)"/>
  <rect width="1600" height="900" rx="32" fill="url(#glow-left)"/>
  <rect width="1600" height="900" rx="32" fill="url(#glow-right)"/>
  <rect x="48" y="48" width="1504" height="804" rx="28" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <text x="96" y="132" class="font title">Chilan architecture at a glance</text>
  <text x="96" y="170" class="font subtitle">Frontend, backend, storage, and AI-assisted grading across the learning platform.</text>

  <g>
    <rect x="96" y="306" width="296" height="192" rx="24" fill="#1E3A8A"/>
    <text x="124" y="342" fill="#DBEAFE" class="font card-label">Frontend</text>
    <text x="124" y="386" class="font card-main">React + Vite</text>
    <text x="124" y="424" fill="#DBEAFE" class="font body">
      <tspan x="124" dy="0">• Home, auth, classroom</tspan>
      <tspan x="124" dy="24">• Course, study, overview</tspan>
      <tspan x="124" dy="24">• Learner-facing web app</tspan>
    </text>
  </g>

  <g>
    <rect x="96" y="550" width="296" height="192" rx="24" fill="#14532D"/>
    <text x="124" y="586" fill="#DCFCE7" class="font card-label">Learning flow</text>
    <text x="124" y="630" class="font card-main">Teach → practice</text>
    <text x="124" y="668" fill="#DCFCE7" class="font body">
      <tspan x="124" dy="0">• Teaching, text, speech</tspan>
      <tspan x="124" dy="24">• Feedback + review loop</tspan>
      <tspan x="124" dy="24">• Main learner session flow</tspan>
    </text>
  </g>

  <g>
    <rect x="438" y="290" width="452" height="224" rx="28" fill="#1F2937" stroke="#475569" stroke-width="2"/>
    <text x="470" y="326" fill="#CBD5E1" class="font card-label">Core service</text>
    <text x="470" y="372" class="font card-main-lg">FastAPI backend</text>
    <text x="470" y="404" fill="#CBD5E1" class="font body">Platform APIs and core services</text>
    <text x="470" y="444" fill="#E2E8F0" class="font body">
      <tspan x="470" dy="0">• Auth, study APIs, review flow</tspan>
      <tspan x="470" dy="24">• Media delivery and app logic</tspan>
      <tspan x="470" dy="24">• Coordinates platform services</tspan>
    </text>
  </g>

  <g>
    <rect x="438" y="534" width="452" height="224" rx="28" fill="#1F2937" stroke="#475569" stroke-width="2"/>
    <text x="470" y="570" fill="#CBD5E1" class="font card-label">Three-tier grading</text>
    <text x="470" y="616" class="font card-main">Regex → Vector → LLM</text>
    <text x="470" y="648" fill="#CBD5E1" class="font body">Semantic answer evaluation</text>
    <text x="470" y="688" fill="#E2E8F0" class="font body">
      <tspan x="470" dy="0">• Regex fast pass + vector match</tspan>
      <tspan x="470" dy="24">• LLM feedback + FSRS updates</tspan>
      <tspan x="470" dy="24">• Flexible grading for learners</tspan>
    </text>
  </g>

  <g>
    <rect x="932" y="210" width="274" height="116" rx="22" fill="#312E81"/>
    <text x="962" y="246" fill="#E0E7FF" class="font card-label">AI services</text>
    <text x="962" y="280" class="font card-main-sm">LLM + vectors</text>
    <text x="962" y="304" fill="#E0E7FF" class="font body-sm">LLM judging + embeddings</text>
  </g>

  <g>
    <rect x="932" y="344" width="274" height="116" rx="22" fill="#7C2D12"/>
    <text x="962" y="380" fill="#FFEDD5" class="font card-label">Speech</text>
    <text x="962" y="414" class="font card-main-sm">ASR + TTS</text>
    <text x="962" y="438" fill="#FFEDD5" class="font body-sm">Recognition + synthesis</text>
  </g>

  <g>
    <rect x="932" y="588" width="274" height="116" rx="22" fill="#4C1D95"/>
    <text x="962" y="624" fill="#F3E8FF" class="font card-label">Data</text>
    <text x="962" y="658" class="font card-main-sm">Postgres + vec</text>
    <text x="962" y="682" fill="#F3E8FF" class="font body-sm">App data + vector search</text>
  </g>

  <g>
    <rect x="932" y="722" width="274" height="116" rx="22" fill="#0F766E"/>
    <text x="962" y="758" fill="#CCFBF1" class="font card-label">Assets</text>
    <text x="962" y="792" class="font card-main-sm">Cloudflare R2</text>
    <text x="962" y="816" fill="#CCFBF1" class="font body-sm">Media object storage</text>
  </g>

  <g>
    <rect x="1258" y="344" width="274" height="116" rx="22" fill="#9A3412"/>
    <text x="1288" y="380" fill="#FFEDD5" class="font card-label">Publishing</text>
    <text x="1288" y="414" class="font card-main-sm">Build flow</text>
    <text x="1288" y="438" fill="#FFEDD5" class="font body-sm">Content build pipeline</text>
  </g>

  <g>
    <rect x="1258" y="564" width="274" height="276" rx="24" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text x="1288" y="602" fill="#CBD5E1" class="font card-label">Shared loop</text>
    <text x="1288" y="642" class="font note-title">Learner + creator</text>
    <text x="1288" y="674" class="font note-sub">Shared content + delivery loop</text>
    <text x="1288" y="710" fill="#E2E8F0" class="font body">
      <tspan x="1288" dy="0">• Shared media lesson assets</tspan>
      <tspan x="1288" dy="28">• Build, publish, course delivery</tspan>
      <tspan x="1288" dy="28">• One loop across learner + creator</tspan>
    </text>
  </g>

  <g class="connector">
    <path d="M392 402H430"/>
    <path d="M392 646H430"/>
    <path d="M890 402H924"/>
    <path d="M890 646H924"/>
    <path d="M1206 402H1250"/>
  </g>

  <g class="arrow">
    <path d="M420 392L438 402L420 412V392Z"/>
    <path d="M420 636L438 646L420 656V636Z"/>
    <path d="M914 392L932 402L914 412V392Z"/>
    <path d="M914 636L932 646L914 656V636Z"/>
    <path d="M1240 392L1258 402L1240 412V392Z"/>
  </g>
</svg>
