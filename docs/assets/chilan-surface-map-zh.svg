<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font {
        font-family: "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, Helvetica, sans-serif;
      }
      .title { fill: #0F172A; font-size: 42px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 20px; font-weight: 500; }
      .chip { font-size: 16px; font-weight: 700; }
      .card-title { fill: #0F172A; font-size: 28px; font-weight: 700; }
      .card-title-sm { fill: #0F172A; font-size: 26px; font-weight: 700; }
      .body { fill: #334155; font-size: 16px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>
  <rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="96" y="96" width="64" height="64" rx="18" fill="#1D4ED8"/>
  <text x="128" y="139" text-anchor="middle" fill="white" font-size="38" class="font" font-weight="700">C</text>
  <text x="190" y="136" class="font title">Chilan 产品界面概览</text>
  <text x="190" y="174" class="font subtitle">README 展示版：学习端与内容工作流的主要界面总览。</text>

  <g>
    <rect x="96" y="286" width="320" height="260" rx="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="126" y="314" width="124" height="32" rx="16" fill="#DBEAFE"/>
    <text x="188" y="336" text-anchor="middle" fill="#1D4ED8" class="font chip">首页</text>
    <text x="126" y="378" class="font card-title">首页与引导</text>
    <text x="126" y="428" class="font body">
      <tspan x="126" dy="0">• 产品定位与首屏印象</tspan>
      <tspan x="126" dy="30">• 登录注册入口</tspan>
      <tspan x="126" dy="30">• 公开主页界面</tspan>
    </text>
  </g>

  <g>
    <rect x="448" y="286" width="320" height="260" rx="24" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
    <rect x="478" y="314" width="124" height="32" rx="16" fill="#DCFCE7"/>
    <text x="540" y="336" text-anchor="middle" fill="#15803D" class="font chip">课程教室</text>
    <text x="478" y="378" class="font card-title">课程教室</text>
    <text x="478" y="428" class="font body">
      <tspan x="478" dy="0">• 我的课程与课程目录</tspan>
      <tspan x="478" dy="30">• 选课、续学与进度</tspan>
      <tspan x="478" dy="30">• 复习节奏提示</tspan>
    </text>
  </g>

  <g>
    <rect x="800" y="286" width="320" height="260" rx="24" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="2"/>
    <rect x="830" y="314" width="124" height="32" rx="16" fill="#F3E8FF"/>
    <text x="892" y="336" text-anchor="middle" fill="#7C3AED" class="font chip">学习</text>
    <text x="830" y="378" class="font card-title">讲解 → 练习</text>
    <text x="830" y="428" class="font body">
      <tspan x="830" dy="0">• 课时内容与媒体</tspan>
      <tspan x="830" dy="30">• 文字与语音练习</tspan>
      <tspan x="830" dy="30">• 三层答案评估</tspan>
    </text>
  </g>

  <g>
    <rect x="1152" y="286" width="320" height="260" rx="24" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
    <rect x="1182" y="314" width="124" height="32" rx="16" fill="#FFEDD5"/>
    <text x="1244" y="336" text-anchor="middle" fill="#C2410C" class="font chip">复习</text>
    <text x="1182" y="378" class="font card-title-sm">FSRS 复习闭环</text>
    <text x="1182" y="428" class="font body">
      <tspan x="1182" dy="0">• 待复习项目与掌握度</tspan>
      <tspan x="1182" dy="30">• FSRS 调度循环</tspan>
      <tspan x="1182" dy="30">• 长期记忆导向</tspan>
    </text>
  </g>

  <g>
    <rect x="272" y="598" width="320" height="214" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="302" y="626" width="176" height="32" rx="16" fill="#E2E8F0"/>
    <text x="390" y="648" text-anchor="middle" fill="#334155" class="font chip">前端应用</text>
    <text x="302" y="688" class="font card-title-sm">React + Vite 前端</text>
    <text x="302" y="726" class="font body">
      <tspan x="302" dy="0">• 首页、认证、课程、学习</tspan>
      <tspan x="302" dy="28">• 多语言学习端体验</tspan>
      <tspan x="302" dy="28">• Remotion 媒体呈现</tspan>
    </text>
  </g>

  <g>
    <rect x="624" y="598" width="320" height="214" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="654" y="626" width="176" height="32" rx="16" fill="#E2E8F0"/>
    <text x="742" y="648" text-anchor="middle" fill="#334155" class="font chip">后端服务</text>
    <text x="654" y="688" class="font card-title">FastAPI 后端</text>
    <text x="654" y="726" class="font body">
      <tspan x="654" dy="0">• 认证与学习接口</tspan>
      <tspan x="654" dy="28">• 复习与媒体服务</tspan>
      <tspan x="654" dy="28">• PostgreSQL + pgvector + R2</tspan>
    </text>
  </g>

  <g>
    <rect x="976" y="598" width="320" height="214" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="1006" y="626" width="176" height="32" rx="16" fill="#E2E8F0"/>
    <text x="1094" y="648" text-anchor="middle" fill="#334155" class="font chip">创作工作流</text>
    <text x="1006" y="688" class="font card-title-sm">创作控制台</text>
    <text x="1006" y="726" class="font body">
      <tspan x="1006" dy="0">• 内容流水线与同步</tspan>
      <tspan x="1006" dy="28">• 本地预览与维护</tspan>
      <tspan x="1006" dy="28">• 制课流程支持</tspan>
    </text>
  </g>
</svg>
